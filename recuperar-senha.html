<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoeFarmaPet - Recuperar Senha</title>
  
  <!-- Estilo vindo do nível anterior -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonte Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <div class="logo-container">
        <img src="../img/logo.png" alt="Logo DoeFarmaPet" class="app-logo">
      </div>

      <div class="auth-header">
        <h1>Recuperar Senha</h1>
        <p>Informe o seu e-mail cadastrado para receber as instruções de redefinição</p>
      </div>

      <form id="form-recuperar" onsubmit="solicitarRecuperacao(event)">
        <div class="input-group">
          <label for="email">E-mail Cadastrado</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-full">Enviar Instruções</button>
      </form>

      <div class="auth-footer">
        <p class="footer-text">Lembrou da senha? <a href="login.html" class="forgot-link">Voltar ao Login</a></p>
        <a href="../index.html" class="back-link">← Voltar para o início</a>
      </div>

    </div>
  </main>

  <script>
    function solicitarRecuperacao(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Enviamos um link de redefinição de senha para o e-mail: ${email}`);
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
