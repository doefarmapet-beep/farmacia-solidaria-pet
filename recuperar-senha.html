<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoeFarmaPet - Recuperar Senha</title>
  
  <!-- Estilo vindo do nível anterior -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonte Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <div class="logo-container">
        <img src="logo2.png" alt="Logo DoeFarmaPet" class="app-logo">
      </div>

      <div class="auth-header">
        <h1>Recuperar Senha</h1>
        <p>A recuperação por e-mail não está configurada para o banco local.</p>
      </div>

      <form id="form-recuperar" onsubmit="solicitarRecuperacao(event)">
        <div class="input-group">
          <label for="email">E-mail Cadastrado</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-full">Verificar recuperação</button>
      </form>

      <div class="auth-footer">
        <p class="footer-text">Lembrou da senha? <a href="login.html" class="forgot-link">Voltar ao Login</a></p>
        <a href="index.html" class="back-link">← Voltar para o início</a>
      </div>

    </div>
  </main>

  <script>
    async function solicitarRecuperacao(event) {
      event.preventDefault();
      try {
        const resposta = await fetch('/api/password-reset-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value })
        });
        const resultado = await resposta.json();
        alert(resultado.error || resultado.message);
      } catch {
        alert('Não foi possível conectar ao banco local.');
      }
    }
  </script>

</body>
</html>
