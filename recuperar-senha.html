<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoeFarmaPet - Recuperar Senha</title>
  
  <!-- Estilo vindo do nível anterior -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonte Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <div class="logo-container">
        <img src="logo2.png" alt="Logo DoeFarmaPet" class="app-logo">
      </div>

      <div class="auth-header">
        <h1>Recuperar Senha</h1>
        <p>Informe seu e-mail para receber as instruções de redefinição de senha.</p>
      </div>

      <form id="form-recuperar" onsubmit="solicitarRecuperacao(event)">
        <div class="input-group" id="email-field">
          <label for="email">E-mail Cadastrado</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <div id="password-fields" hidden>
          <div class="input-group">
            <label for="nova-senha">Nova senha</label>
            <input type="password" id="nova-senha" minlength="6" autocomplete="new-password">
          </div>
          <div class="input-group">
            <label for="confirmar-senha">Confirmar nova senha</label>
            <input type="password" id="confirmar-senha" minlength="6" autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submit-button">Enviar instruções</button>
      </form>

      <div class="auth-footer">
        <p class="footer-text">Lembrou da senha? <a href="login.html" class="forgot-link">Voltar ao Login</a></p>
        <a href="index.html" class="back-link">← Voltar para o início</a>
      </div>

    </div>
  </main>

  <script>
    const recoveryParameters = new URLSearchParams(window.location.hash.slice(1));
    const recoveryAccessToken = recoveryParameters.get('type') === 'recovery'
      ? recoveryParameters.get('access_token')
      : null;
    if (recoveryAccessToken) {
      document.getElementById('email-field').hidden = true;
      document.getElementById('email').required = false;
      document.getElementById('password-fields').hidden = false;
      document.getElementById('nova-senha').required = true;
      document.getElementById('confirmar-senha').required = true;
      document.getElementById('submit-button').textContent = 'Redefinir senha';
      document.querySelector('.auth-header p').textContent = 'Escolha uma nova senha para sua conta.';
    }

    async function solicitarRecuperacao(event) {
      event.preventDefault();
      try {
        const isReset = Boolean(recoveryAccessToken);
        const password = document.getElementById('nova-senha').value;
        if (isReset && password !== document.getElementById('confirmar-senha').value) {
          throw new Error('As senhas não coincidem.');
        }
        const resposta = await fetch(isReset ? '/api/password-reset' : '/api/password-reset-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(isReset
            ? { access_token: recoveryAccessToken, password }
            : { email: document.getElementById('email').value })
        });
        const resultado = await resposta.json();
        if (!resposta.ok) throw new Error(resultado.error || 'Não foi possível redefinir a senha.');
        if (isReset) {
          history.replaceState(null, '', window.location.pathname);
          alert(resultado.message);
          window.location.replace('login.html');
          return;
        }
        alert(resultado.message);
      } catch (erro) {
        alert(erro.message || 'Não foi possível enviar as instruções. Confira o link e tente novamente.');
      }
    }
  </script>

</body>
</html>
