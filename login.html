<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoeFarmaPet - Entrar</title>
  
  <!-- CSS unificado subindo uma pasta (../) -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonte Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <!-- LOGO -->
      <div class="logo-container">
        <img src="logo2.png" alt="Logo DoeFarmaPet" class="app-logo">
      </div>

      <div class="auth-header">
        <h1>Acessar Conta</h1>
        <p>Informe seu e-mail e senha para continuar</p>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="form-login" onsubmit="fazerLogin(event)">
        
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="senha" required placeholder="••••••••">
            <button type="button" class="toggle-password" onclick="alternarVisibilidadeSenha()" aria-label="Mostrar ou ocultar senha">
              <span id="eye-icon">👁️</span>
            </button>
          </div>
        </div>

        <div class="forgot-wrapper">
          <a href="recuperar-senha.html" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>

      </form>

      <!-- RODAPÉ E LINKS DE NAVEGAÇÃO -->
      <div class="auth-footer">
        <div class="sub-actions">
          <a href="cadastro.html" class="btn-link">Realizar Cadastro</a>
          <span class="divider">•</span>
          <a href="recuperar-senha.html" class="btn-link">Recuperar Senha</a>
        </div>

        <a href="../index.html" class="back-link">← Voltar para o início</a>
      </div>

    </div>
  </main>

  <!-- LÓGICA JAVASCRIPT CORRIGIDA -->
  <script>
    function alternarVisibilidadeSenha() {
      const campoSenha = document.getElementById('senha');
      const iconeOlho = document.getElementById('eye-icon');

      if (campoSenha.type === 'password') {
        campoSenha.type = 'text';
        iconeOlho.textContent = '🙈';
      } else {
        campoSenha.type = 'password';
        iconeOlho.textContent = '👁️';
      }
    }

    function fazerLogin(event) {
      event.preventDefault(); // Impede o recarregamento da página

      // Pegamos os valores e removemos espaços em branco nas pontas (.trim)
      const emailDigitado = document.getElementById('email').value.trim().toLowerCase();
      const senhaDigitada = document.getElementById('senha').value.trim();

      // Credenciais válidas para o teste
      const emailCorreto = "admin@doefarmapet.com";
      const senhaCorreta = "123456";

      // Verifica primeiro se o e-mail existe
      if (emailDigitado !== emailCorreto) {
        alert("E-mail não cadastrado ou incorreto.");
      } 
      // Se o e-mail estiver correto, valida a senha
      else if (senhaDigitada === senhaCorreta) {
        alert("Senha digitada corretamente");
        
        // Redireciona para a tela inicial ou painel
        window.location.href = "../index.html"; 
      } 
      // Se a senha estiver errada
      else {
        alert("Senha incorreta");
      }
    }
  </script>

</body>
</html>
